services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GOTOOLCHAIN=auto
    container_name: sangxanh-be
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    labels:
      - "com.sangxanh.description=SangXanh Backend API"
      - "com.sangxanh.version=1.0"

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - app-network

  # Development service with hot reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sangxanh-be-dev
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - APP_ENV=development
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - dev
    labels:
      - "com.sangxanh.description=SangXanh Backend API (Development)"

networks:
  app-network:
    driver: bridge
    name: sangxanh-network

volumes:
  go-modules:
    name: sangxanh-go-modules
  meili_data:
    name: sangxanh-meili-data