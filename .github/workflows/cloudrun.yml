name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: sangxanh-be
  REPOSITORY: sangxanh-be        # Artifact Registry repo name
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
  VM_NAME: ${{ secrets.VM_NAME }}
  VM_REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create .env file from GitHub Secrets
      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_ENV=prod
          SERVER_PORT=${{ secrets.SERVER_PORT }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_KEY=${{ secrets.DATABASE_KEY }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          EOF

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      # Configure Docker to use Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build and push Docker image using Docker Compose
      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker compose build
          docker tag $(docker images -q sangxanh-be-app) "$IMAGE"
          docker push "$IMAGE"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # Deploy to VM instance
      - name: Deploy to VM instance
        run: |
          
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
            sudo docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
            sudo docker stop sangxanh-be || true
            sudo docker rm sangxanh-be || true
            sudo docker run -d \
              --name sangxanh-be \
              -e APP_ENV=prod \
              -e SERVER_PORT=${{ secrets.SERVER_PORT }} \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DATABASE_KEY="${{ secrets.DATABASE_KEY }}" \
              -e CLOUDINARY_URL="${{ secrets.CLOUDINARY_URL }}" \
              -e JWT_KEY="${{ secrets.JWT_KEY }}" \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          EOF
