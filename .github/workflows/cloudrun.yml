name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: sangxanh-be
  REPOSITORY: sangxanh-be        # Artifact Registry repo name
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
  VM_NAME: ${{ secrets.VM_NAME }}
  VM_REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create .env file from GitHub Secrets
      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_ENV=prod
          SERVER_PORT=${{ secrets.SERVER_PORT }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_KEY=${{ secrets.DATABASE_KEY }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          EOF

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      # Configure Docker to use Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build and push Docker image using Docker Compose
      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker compose build
          docker tag $(docker images -q sangxanh-be-app) "$IMAGE"
          docker push "$IMAGE"

      # SSH to VM instance
      - name: SSH to VM instance
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
      
      - name: Deploy on VM
        run: |
            docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
            docker stop sangxanh-be || true
            docker rm sangxanh-be || true
            docker run -d \
              --name sangxanh-be \
              --env-file .env \
              -p 8080:8080 \
              ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
